name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install PyYAML
        run: python3 -m pip install pyyaml --break-system-packages

      - name: Combine VHDL sources
        run: python3 .github/scripts/combine_vhdl.py

      - name: Debug generated VHDL
        run: |
          echo "=== info.yaml ==="
          cat info.yaml

          echo "=== generated.vhdl ==="
          cat src/generated.vhdl

          echo "=== top entity ==="
          grep -n "entity tt_um_opi_siliconpudx" src/generated.vhdl
          
      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl-llvm

      - name: Test GHDL synthesis
        run: |
          echo "=== GHDL version ==="
          ghdl --version

          echo "=== GHDL synthesis ==="
          ghdl synth \
            --std=08 \
            --out=verilog \
            src/generated.vhdl \
            -e tt_um_opi_siliconpudx \
            > /tmp/siliconpudx.v

          echo "=== generated Verilog ==="
          wc -l /tmp/siliconpudx.v
          head -n 30 /tmp/siliconpudx.v

      - name: Debug tt-support-tools
        run: |
          git clone --depth 1 https://github.com/TinyTapeout/tt-support-tools.git /tmp/tt-support-tools

          echo "=== commit ==="
          git -C /tmp/tt-support-tools rev-parse HEAD

          echo "=== transpile_vhdl ==="
          grep -n -A60 -B10 "def transpile_vhdl" /tmp/tt-support-tools/project.py

          echo "=== GHDL references ==="
          grep -R -n "ghdl" /tmp/tt-support-tools --include="*.py"

      - name: Install GF180 PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: gf180mcu
          pdk_version: e8daeda73ca8f5814dbc0b11d1d05802251a3750
          pdk_root: /home/runner/pdk

      - name: Fetch community SRAM Magic hierarchy
        run: |
          git clone https://github.com/RTimothyEdwards/gf180mcu_ocd_ip_sram.git /tmp/gf180mcu_ocd_ip_sram
          git -C /tmp/gf180mcu_ocd_ip_sram checkout efdbf734d806c2ac3b858d281a5b832625a8e928

          MAGIC_SRC=/tmp/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram256x8m8wm1/magic
          MAGIC_DST=components/sram/macros/256x8_3v3/magic
          test -f "$MAGIC_SRC/gf180mcu_ocd_ip_sram__sram256x8m8wm1.mag"

          # Keep the complete hierarchy inside the project so LibreLane does not
          # depend on which CIEL PDK version it resolves at runtime.
          mkdir -p "$MAGIC_DST"
          cp "$MAGIC_SRC"/*.mag "$MAGIC_DST/"
          test -f "$MAGIC_DST/gf180mcu_ocd_ip_sram__sram256x8m8wm1.mag"

          echo "=== project-local SRAM Magic hierarchy ==="
          echo "Source commit: $(git -C /tmp/gf180mcu_ocd_ip_sram rev-parse HEAD)"
          echo "Destination: $MAGIC_DST"
          echo "Copied $(find "$MAGIC_DST" -maxdepth 1 -type f -name '*.mag' | wc -l) .mag files"
      - name: Fetch community SRAM timing libraries
        run: |
          LIB_SRC=/tmp/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram256x8m8wm1
          LIB_DST=components/sram/macros/256x8_3v3/timing
          test -f "$LIB_SRC/gf180mcu_ocd_ip_sram__sram256x8m8wm1__tt_025C_3v30.lib"

          mkdir -p "$LIB_DST"
          cp "$LIB_SRC"/*_3v*.lib "$LIB_DST/"

          # The Liberty cell must match the synthesized wrapper type used by
          # the LEF and MACROS entry. Keep the source corner names unchanged.
          for lib in "$LIB_DST"/*.lib; do
            sed -i 's/gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram_sram256x8m8wm1/g' "$lib"
          done

          echo "=== project-local SRAM timing libraries ==="
          echo "Source commit: $(git -C /tmp/gf180mcu_ocd_ip_sram rev-parse HEAD)"
          echo "Destination: $LIB_DST"
          echo "Copied $(find "$LIB_DST" -maxdepth 1 -type f -name '*.lib' | wc -l) 3.3V .lib files"

          LIB64_SRC=/tmp/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram64x8m8wm1
          LIB64_DST=components/sram/macros/64x8_3v3/timing
          test -f "$LIB64_SRC/gf180mcu_ocd_ip_sram__sram64x8m8wm1__tt_025C_3v30.lib"

          mkdir -p "$LIB64_DST"
          cp "$LIB64_SRC"/*_3v*.lib "$LIB64_DST/"
          for lib in "$LIB64_DST"/*.lib; do
            sed -i 's/gf180mcu_ocd_ip_sram__sram64x8m8wm1/gf180mcu_ocd_ip_sram_sram64x8m8wm1/g' "$lib"
          done

          echo "=== project-local 64x8 SRAM timing libraries ==="
          echo "Copied $(find "$LIB64_DST" -maxdepth 1 -type f -name '*.lib' | wc -l) 3.3V .lib files"

      - name: Install GDS editing dependency
        run: python3 -m pip install gdstk --break-system-packages

      - name: Fix SRAM GDS cell name and PR boundary
        run: python3 .github/scripts/fix_sram_gds.py

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttgf26c
        with:
          pdk: gf180mcuD
          tools-repo: opilitethesmartdev/tt-support-tools-gds-vhdl-patch
          tools-ref: fix/skip-postcts-odb-0445

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare VHDL sources
        run: |
          python3 -m pip install pyyaml
          python3 .github/scripts/combine_vhdl.py

      - name: Prepare SRAM model for gate-level simulation
        run: |
          curl -fsSL https://raw.githubusercontent.com/RTimothyEdwards/gf180mcu_ocd_ip_sram/efdbf734d806c2ac3b858d281a5b832625a8e928/cells/gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram__sram256x8m8wm1.v -o test/sram_macro.v
          sed -i 's/gf180mcu_ocd_ip_sram__sram256x8m8wm1/gf180mcu_ocd_ip_sram_sram256x8m8wm1/g' test/sram_macro.v
          curl -fsSL https://raw.githubusercontent.com/RTimothyEdwards/gf180mcu_ocd_ip_sram/efdbf734d806c2ac3b858d281a5b832625a8e928/cells/gf180mcu_ocd_ip_sram__sram64x8m8wm1/gf180mcu_ocd_ip_sram__sram64x8m8wm1.v -o test/sram64_macro.v
          sed -i 's/gf180mcu_ocd_ip_sram__sram64x8m8wm1/gf180mcu_ocd_ip_sram_sram64x8m8wm1/g' test/sram64_macro.v
          if ! grep -Fq 'VERILOG_SOURCES += $(PWD)/sram_macro.v' test/Makefile; then
            printf '%s\n' 'VERILOG_SOURCES += $(PWD)/sram_macro.v' >> test/Makefile
          fi
          if ! grep -Fq 'VERILOG_SOURCES += $(PWD)/sram64_macro.v' test/Makefile; then
            printf '%s\n' 'VERILOG_SOURCES += $(PWD)/sram64_macro.v' >> test/Makefile
          fi

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttgf26c

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Viewer
        uses: TinyTapeout/tt-gds-action/viewer@ttgf26c