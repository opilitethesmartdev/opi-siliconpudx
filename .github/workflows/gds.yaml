name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Combine VHDL sources
        run: python3 .github/scripts/combine_vhdl.py

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttgf26c
        with:
          pdk: gf180mcuD

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttgf26c

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Viewer
        uses: TinyTapeout/tt-gds-action/viewer@ttgf26c